
name: Rebuild Library

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [library_updated]

permissions:
  contents: write

concurrency:
  group: library-rebuild
  cancel-in-progress: false

jobs:
  check-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check Firebase library
        id: library
        run: node scripts/check-library-changes.js

      - name: Save library fingerprint and trigger deployment
        if: steps.library.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .library-content-hash
          git commit -m "chore: sync Firebase library"
          git pull --rebase origin main
          git push origin HEAD:main
