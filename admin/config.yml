backend:
  name: github
  repo: alamelhada-gif/alamelhada-website
  branch: main
  base_url: https://alamelhada-cms-oauth.alamelhada.workers.dev
  auth_endpoint: auth

locale: ar

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:

  # =========================
  # المقالات
  # =========================

  - name: "articles"
    label: "المقالات"
    label_singular: "مقال"
    folder: "articles"
    create: true
    extension: "md"
    slug: "{{fields.slug}}"

    fields:

      - label: "العنوان"
        name: "title"
        widget: "string"

      - label: "لغة المقال"
        name: "lang"
        widget: "select"
        options:
          - label: "العربية"
            value: "ar"
          - label: "English"
            value: "en"
        default: "ar"

      - label: "رابط المقال"
        name: "slug"
        widget: "string"
        hint: "اكتب رابطاً قصيراً بالإنجليزية فقط، مثال: riwayati-privacy"

      - label: "الملخص"
        name: "summary"
        widget: "text"

      - label: "التاريخ"
        name: "date"
        widget: "datetime"
        time_format: false

      - label: "صورة"
        name: "image"
        widget: "image"
        required: false

      - label: "المحتوى"
        name: "body"
        widget: "markdown"

      - label: "النوع"
        name: "tags"
        widget: "hidden"
        default: "article"


  # =========================
  # السلايدر
  # =========================

  - name: "featured"
    label: "السلايدر"
    label_singular: "عنصر سلايدر"
    folder: "featured"
    create: true
    extension: "md"
    slug: "{{fields.slug}}"

    fields:

      - label: "اسم التطبيق أو العنصر"
        name: "title"
        widget: "string"

      - label: "رابط الصفحة"
        name: "slug"
        widget: "string"
        hint: "اكتب رابطاً قصيراً بالإنجليزية فقط، مثال: falcon-vpn"

      - label: "الأيقونة"
        name: "image"
        widget: "image"
        choose_url: false

      - label: "النص الكامل"
        name: "body"
        widget: "markdown"
        hint: "اكتب التفاصيل كاملة. هذا النص لن يظهر في السلايدر، وسيظهر فقط داخل صفحة التفاصيل."

      - label: "رابط التطبيق"
        name: "app_url"
        widget: "string"
        required: false
        hint: "اختياري. ضع رابط Google Play أو App Store، أو اتركه فارغاً."

      - label: "النوع"
        name: "tags"
        widget: "hidden"
        default: "featured"

      - label: "القالب"
        name: "layout"
        widget: "hidden"
        default: "featured.njk"


  # =========================
  # إعدادات الموقع
  # =========================

  - name: "settings"
    label: "إعدادات الموقع"

    files:

      # =========================
      # الصفحة الرئيسية والهوية
      # =========================

      - label: "الصفحة الرئيسية والهوية"
        name: "site"
        file: "_data/site.json"
        format: "json"

        fields:

          # =========================
          # الهوية
          # =========================

          - label: "اسم الموقع"
            name: "name"
            widget: "string"

          - label: "الاسم العربي"
            name: "name_ar"
            widget: "string"

          - label: "البريد الإلكتروني"
            name: "email"
            widget: "string"

          - label: "شعار الموقع"
            name: "logo"
            widget: "image"
            required: false
            choose_url: false


          # =========================
          # القسم الرئيسي
          # =========================

          - label: "النص الصغير أعلى العنوان"
            name: "hero_eyebrow"
            widget: "string"

          - label: "العنوان - السطر الأول"
            name: "hero_title_line1"
            widget: "string"

          - label: "العنوان - السطر الثاني"
            name: "hero_title_line2"
            widget: "string"

          - label: "الوصف بالعربية"
            name: "tagline_ar"
            widget: "text"

          - label: "الوصف بالإنجليزية"
            name: "tagline_en"
            widget: "text"

          - label: "نص زر التطبيقات"
            name: "hero_primary_button"
            widget: "string"

          - label: "نص زر المقالات"
            name: "hero_secondary_button"
            widget: "string"


          # =========================
          # إعدادات السلايدر
          # =========================

          - label: "إظهار السلايدر"
            name: "show_slider"
            widget: "boolean"
            default: true

          - label: "النص الصغير أعلى السلايدر"
            name: "slider_label"
            widget: "string"
            required: false
            default: "مختارات"

          - label: "عنوان السلايدر"
            name: "slider_title"
            widget: "string"
            required: false
            default: "أحدث التطبيقات والأخبار"


          # =========================
          # التطبيقات
          # =========================

          - label: "إظهار قسم التطبيقات"
            name: "show_apps"
            widget: "boolean"
            default: true

          - label: "النص الصغير لقسم التطبيقات"
            name: "apps_section_label"
            widget: "string"

          - label: "عنوان قسم التطبيقات"
            name: "apps_section_title"
            widget: "string"


          # =========================
          # القسم الأسود
          # =========================

          - label: "إظهار القسم الأسود"
            name: "show_statement"
            widget: "boolean"
            default: true

          - label: "النص الصغير للقسم الأسود"
            name: "statement_small"
            widget: "string"

          - label: "العنوان الكبير للقسم الأسود"
            name: "statement_title"
            widget: "text"


          # =========================
          # المقالات
          # =========================

          - label: "إظهار قسم المقالات"
            name: "show_articles"
            widget: "boolean"
            default: true

          - label: "النص الصغير لقسم المقالات"
            name: "articles_section_label"
            widget: "string"

          - label: "عنوان قسم المقالات"
            name: "articles_section_title"
            widget: "string"


          # =========================
          # القائمة العلوية
          # =========================

          - label: "إظهار التطبيقات في القائمة"
            name: "show_nav_apps"
            widget: "boolean"
            default: true

          - label: "اسم التطبيقات في القائمة"
            name: "nav_apps"
            widget: "string"
            default: "التطبيقات"

          - label: "اسم التطبيقات بالإنجليزية"
            name: "nav_apps_en"
            widget: "string"
            default: "Apps"


          - label: "إظهار المقالات في القائمة"
            name: "show_nav_articles"
            widget: "boolean"
            default: true

          - label: "اسم المقالات في القائمة"
            name: "nav_articles"
            widget: "string"
            default: "المقالات"

          - label: "اسم المقالات بالإنجليزية"
            name: "nav_articles_en"
            widget: "string"
            default: "Articles"


          - label: "إظهار من نحن"
            name: "show_nav_about"
            widget: "boolean"
            default: true

          - label: "اسم من نحن"
            name: "nav_about"
            widget: "string"
            default: "من نحن"

          - label: "اسم من نحن بالإنجليزية"
            name: "nav_about_en"
            widget: "string"
            default: "About"


          - label: "إظهار تواصل"
            name: "show_nav_contact"
            widget: "boolean"
            default: true

          - label: "اسم تواصل"
            name: "nav_contact"
            widget: "string"
            default: "تواصل"

          - label: "اسم تواصل بالإنجليزية"
            name: "nav_contact_en"
            widget: "string"
            default: "Contact"


          # =========================
          # الفوتر
          # =========================

          - label: "اسم الموقع في الفوتر"
            name: "footer_name"
            widget: "string"
            required: false

          - label: "السنة في الفوتر"
            name: "footer_year"
            widget: "string"
            default: "2026"

          - label: "نص سياسة الخصوصية"
            name: "privacy_text"
            widget: "string"
            default: "سياسة الخصوصية"

          - label: "نص سياسة الخصوصية بالإنجليزية"
            name: "privacy_text_en"
            widget: "string"
            default: "Privacy Policy"


          # =========================
          # SEO
          # =========================

          - label: "عنوان الموقع لمحركات البحث"
            name: "seo_title"
            widget: "string"
            required: false

          - label: "وصف الموقع لمحركات البحث"
            name: "seo_description"
            widget: "text"
            required: false

          - label: "صورة الموقع عند المشاركة"
            name: "seo_image"
            widget: "image"
            required: false
            choose_url: false


          # =========================
          # الألوان
          # =========================

          - label: "اللون الأساسي"
            name: "primary"
            widget: "color"

          - label: "اللون الذهبي"
            name: "accent"
            widget: "color"

          - label: "اللون الداكن"
            name: "dark"
            widget: "color"

          - label: "لون الخلفية"
            name: "light"
            widget: "color"


      # =========================
      # التطبيقات
      # =========================

      - label: "التطبيقات"
        name: "apps"
        file: "_data/apps.json"
        format: "json"

        fields:

          - label: "قائمة التطبيقات"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"

            fields:

              - label: "اسم التطبيق"
                name: "name"
                widget: "string"

              - label: "الوصف"
                name: "description"
                widget: "text"

              - label: "صورة اللوغو"
                name: "icon"
                widget: "image"
                choose_url: false
                required: false

              - label: "رابط Google Play"
                name: "url"
                widget: "string"
